name: Phase H Portrait UI Simplification Temp

on:
  push:
    branches:
      - agent/phase-h-portrait-ui-simplification-no-apk
    paths:
      - .github/workflows/phase-h-portrait-ui-simplification-temp.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/phase-h-portrait-ui-simplification-no-apk
          fetch-depth: 0

      - name: Guard Phase H branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/phase-h-portrait-ui-simplification-no-apk"
          git merge-base --is-ancestor 1511689692a85eda7e7ab47b43c43b1d05afc900 HEAD

      - name: Apply focused portrait UI simplification
        shell: bash
        run: python .github/scripts/phase_h_portrait_ui_simplification.py

      - name: Remove temporary mutation helpers
        shell: bash
        run: |
          rm .github/scripts/phase_h_portrait_ui_simplification.py
          rm .github/workflows/phase-h-portrait-ui-simplification-temp.yml

      - name: Verify focused source-only diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          .github/scripts/phase_h_portrait_ui_simplification.py
          .github/workflows/phase-h-portrait-ui-simplification-temp.yml
          app/src/mobile/AndroidManifest.xml
          app/src/mobile/java/app/ownplay/player/ui/TargetLiveRoute.kt
          app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt
          app/src/test/java/app/ownplay/player/PortraitUiSimplificationContractTest.kt
          EOF
          )
          actual=$(git status --porcelain | sed -E 's/^.. //' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          test -z "$(find . -type f -name '*.apk' -print -quit)"
          ! git diff -- app/src | grep -E 'WorkManager|MediaStore\.Downloads|updateActiveTransfer|PlaybackController'

      - name: Commit focused Phase H source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            .github/scripts/phase_h_portrait_ui_simplification.py \
            .github/workflows/phase-h-portrait-ui-simplification-temp.yml \
            app/src/mobile/AndroidManifest.xml \
            app/src/mobile/java/app/ownplay/player/ui/TargetLiveRoute.kt \
            app/src/main/java/app/ownplay/player/ui/library/UnifiedLibraryRoute.kt \
            app/src/test/java/app/ownplay/player/PortraitUiSimplificationContractTest.kt
          git commit -m "Simplify Mobile portrait browsing foundation -no-apk"
          git push origin HEAD:agent/phase-h-portrait-ui-simplification-no-apk
