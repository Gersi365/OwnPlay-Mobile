name: Mobile TV Purge Temp

on:
  push:
    branches:
      - agent/mobile-only-source-normalization-no-apk

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/mobile-only-source-normalization-no-apk
          fetch-depth: 0
      - name: Prepare guarded Mobile-only purge phase 1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/mobile_tv_purge.py')
          text = path.read_text(encoding='utf-8')
          marker = "\nforbidden = [\n"
          if marker not in text:
              raise SystemExit('Phase 1 verification marker missing')
          path.write_text(text.split(marker, 1)[0], encoding='utf-8')
          PY
      - name: Apply guarded Mobile-only purge phase 1
        run: python3 .github/scripts/mobile_tv_purge.py
      - name: Apply guarded Mobile-only purge phase 2
        run: python3 .github/scripts/mobile_tv_purge_extra.py
      - name: Commit source-only purge
        shell: bash
        run: |
          rm .github/workflows/mobile-tv-purge-temp.yml
          rm .github/scripts/mobile_tv_purge.py
          rm .github/scripts/mobile_tv_purge_extra.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Purge Android TV compatibility layer -no-apk"
          git push origin HEAD:agent/mobile-only-source-normalization-no-apk
