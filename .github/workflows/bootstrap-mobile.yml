name: Bootstrap OwnPlay Mobile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event.head_commit.message == 'Run source-only Mobile bootstrap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          path: target

      - name: Checkout verified source authority
        uses: actions/checkout@v6
        with:
          repository: Gersi365/ownplay
          ref: ce128932ff6eb9e7e812fc428fabb40306603b34
          path: source
          persist-credentials: false

      - name: Bootstrap Mobile-only source snapshot
        shell: bash
        run: |
          set -euo pipefail

          cp source/.editorconfig target/.editorconfig
          cp source/.gitignore target/.gitignore
          cp source/build.gradle.kts target/build.gradle.kts
          cp source/gradle.properties target/gradle.properties
          cp source/settings.gradle.kts target/settings.gradle.kts

          rm -rf target/app
          cp -R source/app target/app
          rm -rf target/app/src/tv

          python3 - <<'PY'
          from pathlib import Path

          path = Path('target/app/build.gradle.kts')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          try:
              start = next(i for i, line in enumerate(lines) if 'create("tv") {' in line)
          except StopIteration:
              raise SystemExit('Expected TV flavor declaration not found; refusing bootstrap drift.')

          depth = 0
          end = None
          for i in range(start, len(lines)):
              depth += lines[i].count('{')
              depth -= lines[i].count('}')
              if depth == 0:
                  end = i + 1
                  break
          if end is None:
              raise SystemExit('TV flavor block is unbalanced; refusing bootstrap drift.')

          path.write_text(''.join(lines[:start] + lines[end:]), encoding='utf-8')
          PY

          rm -f target/.bootstrap-trigger

          cd target
          test ! -e app/src/tv
          grep -F 'applicationId = "app.ownplay.mobile"' app/build.gradle.kts
          ! grep -F 'applicationId = "app.ownplay.tv"' app/build.gradle.kts
          ! grep -F 'create("tv")' app/build.gradle.kts

          git config user.name "OwnPlay Mobile Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap OwnPlay Mobile from verified P8.5 source"
          git push origin HEAD:main
