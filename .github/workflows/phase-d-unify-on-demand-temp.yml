name: Phase D Unified On-Demand Temp

on:
  push:
    branches:
      - agent/phase-d-unified-on-demand-fullscreen-no-apk

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase D branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/phase-d-unified-on-demand-fullscreen-no-apk"

      - name: Apply guarded on-demand unification
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase_d_unify_on_demand.py

      - name: Remove temporary mutation helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/phase_d_unify_on_demand.py
          rm .github/workflows/phase-d-unify-on-demand-temp.yml

      - name: Verify focused source-only diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/phase_d_unify_on_demand.py' \
            '.github/workflows/phase-d-unify-on-demand-temp.yml' \
            'app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt' \
            'app/src/test/java/app/ownplay/player/ui/OnDemandPlaybackPresentationContractTest.kt' | sort)"
          test "$actual" = "$expected"
          test ! -e .github/scripts/phase_d_unify_on_demand.py
          test ! -e .github/workflows/phase-d-unify-on-demand-temp.yml

      - name: Commit focused Phase D source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unify on-demand fullscreen presentation -no-apk"
          git push origin "HEAD:${GITHUB_REF_NAME}"
