name: Phase J Series Route Patch Temp

on:
  push:
    branches:
      - agent/phase-j-details-visual-simplification-no-apk
    paths:
      - .github/scripts/phase_j_series_route_patch.py
      - .github/workflows/phase-j-series-route-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase-j-details-visual-simplification-no-apk
          fetch-depth: 0
      - name: Apply guarded Series route patch
        run: python .github/scripts/phase_j_series_route_patch.py
      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/phase_j_series_route_patch.py
          rm .github/workflows/phase-j-series-route-patch-temp.yml
          changed="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/phase_j_series_route_patch.py' \
            '.github/workflows/phase-j-series-route-patch-temp.yml' \
            'app/src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt' | sort)"
          test "$changed" = "$expected"
          grep -Fq 'onEpisodeSelected = { seasonNumber, episodeId ->' app/src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt
          if grep -Fq 'selectedSeasonNumber != null ->' app/src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt; then
            echo 'season is still a back-navigation level' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Series back navigation with inline season selector -no-apk'
          git push
