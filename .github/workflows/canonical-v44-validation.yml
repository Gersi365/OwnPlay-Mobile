name: OwnPlay v44 canonical validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ownplay-v44-canonical-validation
  cancel-in-progress: false

jobs:
  validate-v44:
    if: github.repository_id == '1400670851' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REF: mirror/v44-125787f9
      EXPECTED_MANIFEST_SHA256: 125787f9bdb84eb0af67703d1e52e30097fc406c7cc0bf592508af3996892b43
      EXPECTED_SOURCE_FILE_COUNT: '320'
      EXPECTED_DRIVE_FILE_ID: 1pp44oYyZIKoJfO6zW1HjUYbWgQcU4ynU
      EXPECTED_SOURCE_ZIP_SHA256: d0d77e1437c1690b2a2f00f8a860a74dc40fc0321c5656dc615de3371eadd68d
      EXPECTED_VERSION_CODE: '44'
      EXPECTED_VERSION_NAME: 0.1.0-dev
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out exact canonical mirror without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify repository and canonical import identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Gersi365/OwnPlay-Mobile'
          message="$(git show -s --format=%B HEAD)"
          grep -Fx "SOURCE_MANIFEST_SHA256=$EXPECTED_MANIFEST_SHA256" <<<"$message"
          grep -Fx "SOURCE_FILE_COUNT=$EXPECTED_SOURCE_FILE_COUNT" <<<"$message"
          grep -Fx "CANONICAL_DRIVE_FILE_ID=$EXPECTED_DRIVE_FILE_ID" <<<"$message"
          grep -Fx "SOURCE_ZIP_SHA256=$EXPECTED_SOURCE_ZIP_SHA256" <<<"$message"
          grep -Fx "VERSION_CODE=$EXPECTED_VERSION_CODE" <<<"$message"
          test -z "$(git status --porcelain)"

      - name: Regenerate and verify canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, os
          paths = sorted(
              p.decode() for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p
          )
          expected_count = int(os.environ['EXPECTED_SOURCE_FILE_COUNT'])
          if len(paths) != expected_count:
              raise SystemExit(f'file count mismatch: {len(paths)} != {expected_count}')
          manifest = ''.join(
              hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() + '  ./' + p + '\n'
              for p in paths
          )
          actual = hashlib.sha256(manifest.encode()).hexdigest()
          expected = os.environ['EXPECTED_MANIFEST_SHA256']
          if actual != expected:
              raise SystemExit(f'canonical manifest mismatch: {actual} != {expected}')
          manifest_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'SOURCE_TREE_SHA256.txt'
          manifest_path.write_text(manifest)
          print('SOURCE_MANIFEST_SHA256=' + actual)
          print('SOURCE_FILE_COUNT=' + str(len(paths)))
          print('SOURCE_MANIFEST_PATH=' + str(manifest_path))
          PY
          export OWNPLAY_SOURCE_MANIFEST="$RUNNER_TEMP/SOURCE_TREE_SHA256.txt"
          bash tools/validate-source-no-apk.sh

      - name: Verify package and version source metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "app.ownplay.mobile"' app/build.gradle.kts
          grep -F "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -F "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts

      - name: Verify preinstalled Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Set up pinned Gradle without Actions cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Compile, test, lint and assemble unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            :app:assembleRelease \
            :app:lintVitalRelease

      - name: Verify unsigned release metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='app.ownplay.mobile' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/apk-badging.txt"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'ERROR: expected unsigned release artifact' >&2
            exit 1
          fi
          sha256sum "$APK"
          stat --format='UNSIGNED_APK_BYTES=%s' "$APK"
          echo 'No signing and no artifact upload performed.'
