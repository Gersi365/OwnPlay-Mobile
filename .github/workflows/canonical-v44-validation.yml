name: OwnPlay Unified DVR exact-source diagnostic

on:
  push:
    branches:
      - ci/unified-dvr-compilefix-c19172f3
    paths:
      - .github/workflows/canonical-v44-validation.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out CI metadata
        uses: actions/checkout@v4
        with:
          ref: ci/unified-dvr-compilefix-c19172f3
          path: ci
          persist-credentials: false
          fetch-depth: 1

      - name: Check out repaired candidate
        uses: actions/checkout@v4
        with:
          ref: a37efc616edbcbff0aaff1883b7316c9542ab8b3
          path: src
          persist-credentials: false
          fetch-depth: 1

      - name: Compare every candidate file with Drive sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd src
          grep -v '^#' ../ci/.ci/expected-source.sha256.txt > "$RUNNER_TEMP/expected.sha256"
          sha256sum -c "$RUNNER_TEMP/expected.sha256" > "$RUNNER_TEMP/check.log" 2>&1 || true
          grep -v ': OK$' "$RUNNER_TEMP/check.log" || true
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          paths=sorted(p.decode() for p in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if p)
          m=''.join(hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()+'  ./'+p+'\n' for p in paths)
          print('ACTUAL_FILE_COUNT='+str(len(paths)))
          print('ACTUAL_MANIFEST_SHA256='+hashlib.sha256(m.encode()).hexdigest())
          PY
          if ! sha256sum -c "$RUNNER_TEMP/expected.sha256" >/dev/null 2>&1; then
            exit 2
          fi
