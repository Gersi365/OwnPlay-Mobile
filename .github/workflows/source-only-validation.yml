name: OwnPlay Source Only Validation

on:
  push:
    branches:
      - execution/source-only-d89e5e4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout execution mirror
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate source without APK or AAB
        env:
          OWNPLAY_ACCEPT_ANDROID_SDK_LICENSES: '1'
          OWNPLAY_SOURCE_MANIFEST: ${{ github.workspace }}/SOURCE_TREE_SHA256.txt
        run: bash tools/bootstrap-android-build-env.sh --install --validate
