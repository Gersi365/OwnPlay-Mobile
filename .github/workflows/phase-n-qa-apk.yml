name: Phase N QA APK

on:
  push:
    branches:
      - qa/phase-n-b553e89b-apk

permissions:
  contents: read

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact Phase N candidate
        uses: actions/checkout@v6
        with:
          ref: b553e89b3afe060aba5c50fe267fa3b3cbb86635
          fetch-depth: 1

      - name: Verify exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          expected="b553e89b3afe060aba5c50fe267fa3b3cbb86635"
          actual="$(git rev-parse HEAD)"
          echo "Expected source SHA: ${expected}"
          echo "Checked out source SHA: ${actual}"
          test "${actual}" = "${expected}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Verify Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"

      - name: Build Mobile debug QA APK
        run: gradle :app:assembleMobileDebug --stacktrace

      - name: Verify APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/mobile/debug/app-mobile-debug.apk"
          test -f "${apk}"

          mkdir -p qa-artifacts
          output="qa-artifacts/OwnPlay-Mobile-Phase-N-b553e89b-debug.apk"
          cp "${apk}" "${output}"

          badging="$(${ANDROID_HOME}/build-tools/36.0.0/aapt dump badging "${output}" | head -n 1)"
          printf '%s\n' "${badging}" | tee qa-artifacts/qa-apk-badging.txt
          printf '%s\n' "${badging}" | grep -F "package: name='app.ownplay.mobile'"
          printf '%s\n' "${badging}" | grep -F "versionCode='15'"
          printf '%s\n' "${badging}" | grep -F "versionName='1.0.13-product-polish-update'"

          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --print-certs "${output}" \
            | tee qa-artifacts/qa-apk-signing.txt
          sha256sum "${output}" | tee qa-artifacts/qa-apk-sha256.txt

          {
            echo "source_sha=b553e89b3afe060aba5c50fe267fa3b3cbb86635"
            echo "package=app.ownplay.mobile"
            echo "version_code=15"
            echo "version_name=1.0.13-product-polish-update"
            echo "variant=mobileDebug"
            echo "apk=OwnPlay-Mobile-Phase-N-b553e89b-debug.apk"
          } | tee qa-artifacts/qa-build-metadata.txt

      - name: Upload Phase N QA APK
        uses: actions/upload-artifact@v4
        with:
          name: ownplay-mobile-phase-n-qa-apk-b553e89b
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 7
