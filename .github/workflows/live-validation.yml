name: OwnPlay Mobile LIVE validation

on:
  workflow_dispatch:
  push:
    branches:
      - live-epg-recordings-candidate

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.4.0 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
          cache-disabled: true

      - name: Compile and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
