name: Mobile-only normalization one-shot

on:
  push:
    branches:
      - agent/mobile-only-source-normalization-no-apk

permissions:
  contents: write

jobs:
  normalize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize dead build-target routing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          gradle = Path('app/build.gradle.kts')
          activity = Path('app/src/main/java/app/ownplay/player/MainActivity.kt')
          root = Path('app/src/main/java/app/ownplay/player/ui/OwnPlayRoot.kt')
          orientation = Path('app/src/main/java/app/ownplay/player/personalization/AppOrientationStore.kt')

          texts = {p: p.read_text(encoding='utf-8') for p in (gradle, activity, root, orientation)}

          flag_line = '            buildConfigField("boolean", "IS_TV_BUILD", "false")\n'
          target_line = '            buildConfigField("String", "TARGET_DEVICE", "\\\"mobile\\\"")\n'
          activity_block = '''        offlineDownloadRuntime = if (BuildConfig.IS_TV_BUILD) {\n            null\n        } else {\n            OfflineDownloadFeatureRuntime(applicationContext)\n        }\n'''
          root_imports = [
              'import androidx.compose.runtime.withFrameNanos\n',
              'import androidx.compose.ui.focus.FocusDirection\n',
              'import androidx.compose.ui.platform.LocalFocusManager\n',
              'import app.ownplay.player.BuildConfig\n',
          ]
          root_focus = '    val focusManager = LocalFocusManager.current\n'
          root_block = '''\n    LaunchedEffect(BuildConfig.IS_TV_BUILD, contentVisible) {\n        if (BuildConfig.IS_TV_BUILD && contentVisible) {\n            withFrameNanos { }\n            if (!focusManager.moveFocus(FocusDirection.Next)) {\n                withFrameNanos { }\n                focusManager.moveFocus(FocusDirection.Next)\n            }\n        }\n    }\n'''
          orientation_import = 'import app.ownplay.player.BuildConfig\n'
          orientation_comment = '''/**\n * Compatibility facade for the compile-time Mobile/TV targets.\n *\n * Mobile may change Smartphone orientation. TV is permanently landscape and rejects orientation\n * writes. Runtime profile changes cannot switch either APK into the other target's input model.\n */'''
          orientation_comment_new = '''/**\n * Mobile orientation compatibility facade retained for existing call sites.\n *\n * OwnPlay Mobile targets touch-first Android phones and tablets. Orientation writes apply to the\n * Mobile profile only.\n */'''
          orientation_builder = '''private fun buildTargetDeviceProfile(): AppDeviceProfile = if (BuildConfig.IS_TV_BUILD) {\n    AppDeviceProfile.ANDROID_TV\n} else {\n    AppDeviceProfile.SMARTPHONE\n}\n'''
          orientation_builder_new = 'private fun buildTargetDeviceProfile(): AppDeviceProfile = AppDeviceProfile.SMARTPHONE\n'

          already_normalized = (
              flag_line not in texts[gradle]
              and target_line not in texts[gradle]
              and 'BuildConfig.IS_TV_BUILD' not in ''.join(texts.values())
          )
          if already_normalized:
              print('Mobile-only build routing is already normalized; no source mutation needed.')
              raise SystemExit(0)

          expected = [
              ('IS_TV_BUILD Gradle field', texts[gradle].count(flag_line), 1),
              ('TARGET_DEVICE Gradle field', texts[gradle].count(target_line), 1),
              ('MainActivity target branch', texts[activity].count(activity_block), 1),
              ('OwnPlayRoot target effect', texts[root].count(root_block), 1),
              ('AppOrientationStore BuildConfig import', texts[orientation].count(orientation_import), 1),
              ('AppOrientationStore target builder', texts[orientation].count(orientation_builder), 1),
          ]
          failures = [f'{name}: expected {want}, found {got}' for name, got, want in expected if got != want]
          for item in root_imports:
              if texts[root].count(item) != 1:
                  failures.append(f'OwnPlayRoot import mismatch: {item.strip()}')
          if texts[root].count(root_focus) != 1:
              failures.append('OwnPlayRoot focus manager mismatch')
          if texts[orientation].count(orientation_comment) != 1:
              failures.append('AppOrientationStore compatibility comment mismatch')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              raise SystemExit(2)

          texts[gradle] = texts[gradle].replace(flag_line, '').replace(target_line, '')
          texts[activity] = texts[activity].replace(
              activity_block,
              '        offlineDownloadRuntime = OfflineDownloadFeatureRuntime(applicationContext)\n',
          )
          for item in root_imports:
              texts[root] = texts[root].replace(item, '')
          texts[root] = texts[root].replace(root_focus, '').replace(root_block, '')
          texts[orientation] = texts[orientation].replace(orientation_import, '')
          texts[orientation] = texts[orientation].replace(orientation_comment, orientation_comment_new)
          texts[orientation] = texts[orientation].replace(orientation_builder, orientation_builder_new)

          for path, text in texts.items():
              path.write_text(text, encoding='utf-8')

          remaining = []
          for path in Path('app').rglob('*'):
              if not path.is_file() or path.suffix not in {'.kt', '.kts'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if 'BuildConfig.IS_TV_BUILD' in text or 'BuildConfig.TARGET_DEVICE' in text:
                  remaining.append(str(path))
          if remaining:
              print('Unexpected build-target references remain:', *remaining, sep='\n', file=sys.stderr)
              raise SystemExit(3)
          PY

      - name: Commit normalized source
        shell: bash
        run: |
          if git diff --quiet -- app/build.gradle.kts app/src/main/java/app/ownplay/player/MainActivity.kt app/src/main/java/app/ownplay/player/ui/OwnPlayRoot.kt app/src/main/java/app/ownplay/player/personalization/AppOrientationStore.kt; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'Gersi365'
          git config user.email 'Gersi365@outlook.com'
          git add app/build.gradle.kts \
            app/src/main/java/app/ownplay/player/MainActivity.kt \
            app/src/main/java/app/ownplay/player/ui/OwnPlayRoot.kt \
            app/src/main/java/app/ownplay/player/personalization/AppOrientationStore.kt
          git commit -m 'Normalize Mobile-only build routing -no-apk'
          git push origin HEAD:agent/mobile-only-source-normalization-no-apk
