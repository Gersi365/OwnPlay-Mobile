name: OwnPlay unified DVR candidate validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unified-dvr-candidate-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ownplay-unified-dvr-candidate-validation
  cancel-in-progress: false

jobs:
  validate-candidate:
    if: github.repository_id == '1400670851' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REF: 701b8fa589af4da881846e5d60ef73c9f4a5c57f
      EXPECTED_MANIFEST_SHA256: 0c6c9b69a3217f5e3417027b06c07e4c166fc7966b14a4e209feb3743af20b9b
      EXPECTED_SOURCE_FILE_COUNT: '324'
      EXPECTED_DRIVE_FILE_ID: 1Hd2o7Y0tdkjdWJ2puBALb48lsi5DUrkK
      EXPECTED_SOURCE_ZIP_SHA256: 2ab8d5217e29155f3f5f19b1815cdfb975f595f7f69754bb39388710c2b95f20
      EXPECTED_CHECKPOINT_DRIVE_FILE_ID: 1I4y8sXXG4PTRvQHtdO5LIvb2Wz7flhaj
      EXPECTED_CHECKPOINT_ZIP_SHA256: e98b234ba8923957b454ccb1a6434a8e8e4d2ab7f38c2b9121bcb5cd09c584ac
      EXPECTED_VERSION_CODE: '44'
      EXPECTED_VERSION_NAME: 0.1.0-dev
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out exact noncanonical candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify repository and candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Gersi365/OwnPlay-Mobile'
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          message="$(git show -s --format=%B HEAD)"
          grep -Fx "SOURCE_MANIFEST_SHA256=$EXPECTED_MANIFEST_SHA256" <<<"$message"
          grep -Fx "SOURCE_FILE_COUNT=$EXPECTED_SOURCE_FILE_COUNT" <<<"$message"
          grep -Fx "SOURCE_DRIVE_FILE_ID=$EXPECTED_DRIVE_FILE_ID" <<<"$message"
          grep -Fx "SOURCE_ZIP_SHA256=$EXPECTED_SOURCE_ZIP_SHA256" <<<"$message"
          grep -Fx "SOURCE_CHECKPOINT_DRIVE_FILE_ID=$EXPECTED_CHECKPOINT_DRIVE_FILE_ID" <<<"$message"
          grep -Fx "SOURCE_CHECKPOINT_ZIP_SHA256=$EXPECTED_CHECKPOINT_ZIP_SHA256" <<<"$message"
          grep -Fx "VERSION_CODE=$EXPECTED_VERSION_CODE" <<<"$message"
          grep -Fx "NONCANONICAL_VALIDATION_PENDING=1" <<<"$message"
          test -z "$(git status --porcelain)"

      - name: Select Java 21 for source validation
        shell: bash
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Set up pinned Gradle without Actions cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Regenerate and verify exact candidate source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, os
          paths = sorted(
              p.decode() for p in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0') if p
          )
          expected_count = int(os.environ['EXPECTED_SOURCE_FILE_COUNT'])
          if len(paths) != expected_count:
              raise SystemExit(f'file count mismatch: {len(paths)} != {expected_count}')
          manifest = ''.join(
              hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() + '  ./' + p + '\n'
              for p in paths
          )
          actual = hashlib.sha256(manifest.encode()).hexdigest()
          expected = os.environ['EXPECTED_MANIFEST_SHA256']
          if actual != expected:
              raise SystemExit(f'candidate manifest mismatch: {actual} != {expected}')
          manifest_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'SOURCE_TREE_SHA256.txt'
          manifest_path.write_text(manifest)
          print('SOURCE_MANIFEST_SHA256=' + actual)
          print('SOURCE_FILE_COUNT=' + str(len(paths)))
          print('SOURCE_MANIFEST_PATH=' + str(manifest_path))
          PY
          export OWNPLAY_SOURCE_MANIFEST="$RUNNER_TEMP/SOURCE_TREE_SHA256.txt"
          bash tools/validate-source-no-apk.sh

      - name: Verify package and version source metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "app.ownplay.mobile"' app/build.gradle.kts
          grep -F "versionCode = $EXPECTED_VERSION_CODE" app/build.gradle.kts
          grep -F "versionName = \"$EXPECTED_VERSION_NAME\"" app/build.gradle.kts

      - name: Compile, run full JVM tests, compile Android tests, lint and assemble unsigned release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache \
            :app:compileDebugKotlin \
            :app:testDebugUnitTest \
            :app:compileDebugAndroidTestKotlin \
            :app:lintDebug \
            :app:assembleRelease \
            :app:lintVitalRelease

      - name: Summarize JVM test execution
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print('UNIT_TEST_REPORT_COUNT=' + str(len(reports)))
          print('UNIT_TEST_TOTALS=' + str(totals))
          PY

      - name: Verify unsigned release metadata and no artifact upload
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='app.ownplay.mobile' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" "$RUNNER_TEMP/apk-badging.txt"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'ERROR: expected unsigned release artifact' >&2
            exit 1
          fi
          sha256sum "$APK"
          stat --format='UNSIGNED_APK_BYTES=%s' "$APK"
          echo 'No signing and no artifact upload performed.'
