name: OwnPlay Mobile QA v37 unsigned presign

# Execution-only mirror workflow. Canonical candidate is held in OwnPlay Mobile Drive.
# Inert until an explicit manual dispatch or a change to the exact marker path
# on main, AFTER verified zero-additional-cost and unsigned handoff gates.
# Editing this workflow file alone does not match the narrow push paths filter.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - tools/qa-v37/presign-trigger.txt

permissions:
  contents: read

jobs:
  unsigned-presign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact Drive-approved candidate mirror
        uses: actions/checkout@v4
        with:
          ref: e52aa593f3ac18ae96373c8b139e277d13c4a1f0
          persist-credentials: false

      - name: Reject different repository or candidate tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Gersi365/OwnPlay-Mobile'
          test "$(git rev-parse HEAD)" = 'e52aa593f3ac18ae96373c8b139e277d13c4a1f0'
          test "$(git rev-parse 'HEAD^{tree}')" = '57c3e6fb137b5e650b55148a8c4ed2092e166caa'
          test -z "$(git status --porcelain)"
          echo 'Exact 280-file candidate identity: PASS'

      - name: Apply only the approved QA v37 packaging version overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p = Path('app/build.gradle.kts')
          original = subprocess.check_output(
              ['git', 'show', 'HEAD:app/build.gradle.kts'], text=True
          )
          if p.read_text() != original:
              raise SystemExit('Checkout source differs before packaging overlay')
          old = '        versionCode = 1\n'
          new = '        versionCode = 37\n'
          if original.count(old) != 1 or original.count('versionName = "0.1.0-dev"') != 1:
              raise SystemExit('QA packaging baseline changed; do not guess')
          expected = original.replace(old, new, 1)
          p.write_text(expected)
          if p.read_text() != expected:
              raise SystemExit('Unexpected QA packaging transformation')
          names = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          if names != ['app/build.gradle.kts']:
              raise SystemExit('Unexpected source changes during packaging')
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('Version-only QA v37 packaging overlay: PASS')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept existing Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          python3 -c 'import subprocess,sys; raise SystemExit(subprocess.run([sys.argv[1], "--licenses"], input=b"y\n" * 32).returncode)' "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Install Android 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6.0 without cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true

      - name: Build unsigned release APK (no signing identity)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align and independently check QA version and unsigned state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-output
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          input=app/build/outputs/apk/release/app-release-unsigned.apk
          output=qa-output/OwnPlay-QA-v37-presign-aligned.apk
          "$sdk/zipalign" -P 16 -f -v 4 "$input" "$output"
          "$sdk/zipalign" -P 16 -c -v 4 "$output"
          "$sdk/aapt2" dump badging "$output" > qa-output/PRESIGN_BADGING.txt
          grep -F "package: name='app.ownplay.mobile' versionCode='37' versionName='0.1.0-dev'" qa-output/PRESIGN_BADGING.txt
          if "$sdk/apksigner" verify "$output" >/dev/null 2>&1; then
            echo 'Unexpected signature in the unsigned presign APK' >&2
            exit 1
          fi
          sha256sum "$output" > qa-output/PRESIGN_SHA256.txt
          {
            echo 'SIGNED: NO (presign only)'
            echo 'PACKAGE: app.ownplay.mobile'
            echo 'VERSION_CODE: 37'
            echo 'VERSION_NAME: 0.1.0-dev'
            echo 'SOURCE_COMMIT: e52aa593f3ac18ae96373c8b139e277d13c4a1f0'
            echo 'SOURCE_TREE: 57c3e6fb137b5e650b55148a8c4ed2092e166caa'
            echo 'DRIVE_CANDIDATE_ZIP_SHA256: 4bdf748d814c0a36c27e1b69ef991117abd6512c7c6178d9b4474e2083ca969f'
            echo 'PACKAGING_OVERLAY: only app/build.gradle.kts versionCode 1 to 37'
            echo 'FINAL_QA_SIGNING: NOT PERFORMED; must use prior separate protected QA identity'
          } > qa-output/PRESIGN_METADATA.txt
          echo 'Unsigned QA v37 presign metadata and alignment: PASS'
          cat qa-output/PRESIGN_SHA256.txt

      # Deliberately no artifact-upload step. This execution-only workflow must
      # not publish the APK from a public repository until the owner's LIVE
      # private-handoff and exact zero-additional-cost gates are verified.
