name: OPM temporary historical reference cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-historical-refs.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository_id == '1400670851' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate and delete exact historical branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          expected = {
              "candidate/unified-dvr-0c6c9b69": "701b8fa589af4da881846e5d60ef73c9f4a5c57f",
              "candidate/unified-dvr-9438fed5": "fed8009ac7585cd6a5455a949ce46b9d7cd823cb",
              "candidate/unified-dvr-compilefix-c19172f3": "f967d3e9721d9dd4eac598f2dc85613495dc7e61",
              "candidate/v46-live-playback-fallback": "c5e44c2e71cacc4f712540984d8636b3301a7690",
              "candidate/v47-live-remediation-20261008T015532Z": "d66048648bcb315548395c87386e4c15a574db14",
              "ci/unified-dvr-compilefix-c19172f3": "ab1208a7afc6e45a5c581fe9de71ba39513d1e48",
              "ci/v46-live-playback-fallback": "9745b00cfb8d0c07ab81716bf421d93faa3b4dd3",
              "mirror/v44-125787f9": "fed8009ac7585cd6a5455a949ce46b9d7cd823cb",
              "mirror/v45-bb6b5155": "311dd2c2f2ff5392474099c2d9833eef5e40264f",
              "mirror/v46-e2b12180": "8e39bfeb8f549121adca7e2ceb44f174ac8c0195",
          }
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("GITHUB_TOKEN unavailable")
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "opm-temporary-ref-cleanup",
          }
          def url_for(branch):
              return "https://api.github.com/repos/Gersi365/OwnPlay-Mobile/git/refs/heads/" + urllib.parse.quote(branch, safe="/")
          verified = []
          for branch, expected_sha in expected.items():
              request = urllib.request.Request(url_for(branch), headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      print("ALREADY_ABSENT " + branch, flush=True)
                      continue
                  raise
              actual = payload.get("object", {}).get("sha")
              if actual != expected_sha or payload.get("ref") != "refs/heads/" + branch:
                  raise SystemExit("STALE_BRANCH_ABORT " + branch)
              verified.append(branch)
          print("PREFLIGHT_MATCHED=" + str(len(verified)), flush=True)
          for branch in verified:
              request = urllib.request.Request(url_for(branch), headers=headers, method="DELETE")
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 204:
                      raise SystemExit("DELETE_NOT_CONFIRMED " + branch)
              print("DELETED " + branch, flush=True)
          print("HISTORICAL_REFS_DELETE_COMPLETE", flush=True)
          PY
