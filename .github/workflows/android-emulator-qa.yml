name: Android Emulator Instrumentation QA

on:
  push:
    branches:
      - qa-emulator

permissions:
  contents: read

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Ensure Android emulator packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager | head -n 1)"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER"             "platform-tools"             "emulator"             "platforms;android-36"             "build-tools;36.0.0"             "system-images;android-36;google_apis;x86_64"
          echo "no" | "$AVDMANAGER" create avd             --force             --name ownplay-ci             --package "system-images;android-36;google_apis;x86_64"             --device "pixel_6"

      - name: Start disposable emulator
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          nohup "$SDK_ROOT/emulator/emulator"             -avd ownplay-ci             -no-window             -no-audio             -no-boot-anim             -no-snapshot             -no-metrics             -gpu swiftshader_indirect             -camera-back none             -camera-front none             > "$RUNNER_TEMP/ownplay-emulator.log" 2>&1 &
          adb wait-for-device
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true
          adb devices
          test "$(adb devices | awk 'NR > 1 && $2 == "device" { n++ } END { print n+0 }')" -eq 1

      - name: Run OwnPlay instrumentation QA
        shell: bash
        run: bash tools/run-android-instrumentation-qa.sh

      - name: Capture empty-launch screenshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-runtime-evidence
          adb shell am start -W -n app.ownplay.mobile/.MainActivity || true
          sleep 3
          adb exec-out screencap -p > qa-runtime-evidence/empty-launch.png || true
          adb shell uiautomator dump /sdcard/ownplay-window.xml || true
          adb pull /sdcard/ownplay-window.xml qa-runtime-evidence/window.xml || true
          adb logcat -d > qa-runtime-evidence/logcat.txt || true
          cp "$RUNNER_TEMP/ownplay-emulator.log" qa-runtime-evidence/emulator.log || true
          if [[ -d app/build/outputs/androidTest-results ]]; then
            mkdir -p qa-runtime-evidence/androidTest-results
            find app/build/outputs/androidTest-results -type f -name '*.xml' -exec cp {} qa-runtime-evidence/androidTest-results/ \; || true
          fi

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OwnPlay-Mobile-emulator-QA
          path: qa-runtime-evidence/
          retention-days: 7
