name: Phase E Progress Start Intent Temp

on:
  push:
    branches:
      - agent/phase-e-progress-start-intent-no-apk

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Phase E branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/phase-e-progress-start-intent-no-apk"

      - name: Apply guarded progress start-intent fix
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/phase_e_progress_start_intent.py

      - name: Remove temporary mutation helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/phase_e_progress_start_intent.py
          rm .github/workflows/phase-e-progress-start-intent-temp.yml

      - name: Verify focused source-only diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/phase_e_progress_start_intent.py' \
            '.github/workflows/phase-e-progress-start-intent-temp.yml' \
            'app/src/main/java/app/ownplay/player/ui/series/SeriesDetailsPane.kt' \
            'app/src/main/java/app/ownplay/player/ui/series/SeriesRoute.kt' \
            'app/src/main/java/app/ownplay/player/ui/vod/MovieDetailsPane.kt' \
            'app/src/main/java/app/ownplay/player/ui/vod/VodRoute.kt' \
            'app/src/test/java/app/ownplay/player/ui/PlaybackProgressStartIntentContractTest.kt' | sort)"
          test "$actual" = "$expected"
          test ! -e .github/scripts/phase_e_progress_start_intent.py
          test ! -e .github/workflows/phase-e-progress-start-intent-temp.yml

      - name: Commit focused Phase E source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve progress for play-from-beginning intent -no-apk"
          git push origin "HEAD:${GITHUB_REF_NAME}"
